<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<meta name="description" content="Web site created using create-react-app" />
		<link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
		<!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
		<link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
		<!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
		<!--
			SECURITY (VULN-12): Content Security Policy for the SPA shell.

			The API sets its own CSP (VULN-09), but that header only covers
			responses from the API origin. The static client is served from a
			different origin and needs its own policy, otherwise an injected
			<script> in the page would run unrestricted.

			  script-src 'self'   only bundles served from this origin run.
			                      This requires INLINE_RUNTIME_CHUNK=false
			                      (set in client/.env), because CRA otherwise
			                      inlines its webpack runtime into this file
			                      and that inline script would be blocked.
			  style-src           'unsafe-inline' is unavoidable here:
			                      Material-UI v4 injects component styles at
			                      runtime via JSS. Recorded as residual risk.
			  img-src data:       post images are rendered as data: URIs.
			                      Safe because uploads are content-sniffed
			                      and restricted to real image types (VULN-08).
			  connect-src         the API origin; adjust when deploying.
			  object-src 'none'   no Flash/embed legacy plugin content.
			  base-uri 'self'     stops <base> tag injection retargeting
			                      every relative URL on the page.

			Note: frame-ancestors is ignored in a <meta> policy and must be
			sent as a real header by whatever serves this build. The report
			records this.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self';
			         script-src 'self';
			         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
			         font-src 'self' https://fonts.gstatic.com data:;
			         img-src 'self' data: blob: https://source.unsplash.com https://images.unsplash.com;
			         connect-src 'self' http://localhost:5000;
			         object-src 'none';
			         base-uri 'self';
			         form-action 'self'"
		/>
		<meta name="referrer" content="no-referrer" />

		<!-- Compiled and minified CSS -->
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
		<title>Instagram Clone App</title>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>

      To create a production bundle, use `npm run build` or `yarn build`.
    -->
	</body>
</html>
